<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Library & Printing</title>
  <script>
    var path = window.location.pathname.split('/').filter(Boolean);
    var repository = path.length > 0 ? '/' + path[0] + '/' : '/';
    window.location.replace(window.location.origin + repository);
  </script>
</head>
<body>
  Redirecting to E-Library & Printing...
</body>
</html>
