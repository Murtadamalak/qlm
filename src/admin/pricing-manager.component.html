<div class="bg-white p-6 rounded-lg shadow-sm max-w-2xl mx-auto">
    <h3 class="text-xl font-semibold text-slate-800 mb-6">إدارة أسعار الطباعة</h3>
    <form (ngSubmit)="savePrices()" class="space-y-4">
        <div>
            <label for="priceBw" class="block text-sm font-medium text-slate-700">سعر الصفحة (أبيض وأسود)</label>
            <input id="priceBw" name="priceBw" type="number" [(ngModel)]="priceBw" required class="mt-1 block w-full rounded-md border-slate-300 shadow-sm focus:border-teal-500 focus:ring-teal-500">
        </div>
        <div>
            <label for="priceColor" class="block text-sm font-medium text-slate-700">سعر الصفحة (ملون)</label>
            <input id="priceColor" name="priceColor" type="number" [(ngModel)]="priceColor" required class="mt-1 block w-full rounded-md border-slate-300 shadow-sm focus:border-teal-500 focus:ring-teal-500">
        </div>
        <div>
            <label for="priceStaple" class="block text-sm font-medium text-slate-700">تكلفة التجليد (تدبيس)</label>
            <input id="priceStaple" name="priceStaple" type="number" [(ngModel)]="priceStaple" required class="mt-1 block w-full rounded-md border-slate-300 shadow-sm focus:border-teal-500 focus:ring-teal-500">
        </div>
        <div>
            <label for="priceSpiral" class="block text-sm font-medium text-slate-700">تكلفة التجليد (حلزوني)</label>
            <input id="priceSpiral" name="priceSpiral" type="number" [(ngModel)]="priceSpiral" required class="mt-1 block w-full rounded-md border-slate-300 shadow-sm focus:border-teal-500 focus:ring-teal-500">
        </div>

        <div class="flex justify-end items-center gap-4 pt-4">
             @if(showSuccess()) {
                <p class="text-sm text-green-600">تم حفظ الأسعار بنجاح!</p>
             }
            <button type="submit" class="px-4 py-2 text-sm font-medium rounded-md text-white bg-teal-600 hover:bg-teal-700">حفظ الأسعار</button>
        </div>
    </form>
</div>
