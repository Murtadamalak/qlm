@if (view() === 'login') {
  <app-login (loginSuccess)="onLoginSuccess()"></app-login>
} @else {
  <div class="min-h-screen bg-[#F0EDE5] text-[#004643] flex flex-col selection:bg-[#004643] selection:text-[#F0EDE5]">
    <app-header (navigate)="onNavigate($event)"></app-header>

    <main class="container mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-10 flex-grow">
      @switch (view()) {
        @case ('home') {
          <app-home (navigate)="onNavigate($event)"></app-home>
        }
        @case ('store') {
          <app-store></app-store>
        }
        @case ('cart') {
          <app-cart (checkoutSuccess)="onNavigate('orders')"></app-cart>
        }
        @case ('orders') {
          <app-orders></app-orders>
        }
        @case ('admin') {
          <app-admin></app-admin>
        }
      }
    </main>

    <footer class="border-t border-[#004643]/10 bg-[#004643] text-[#F0EDE5]">
      <div class="container mx-auto py-8 px-4 flex flex-col gap-2 text-center">
        <p class="font-bold tracking-wide">مكتبة القلم</p>
        <p class="text-sm text-[#F0EDE5]/70">تجربة تسوق قرطاسية حديثة وسريعة — &copy; 2026</p>
      </div>
    </footer>
  </div>
}
