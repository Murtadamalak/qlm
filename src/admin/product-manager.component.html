<div class="space-y-6">
  <section class="rounded-[2rem] border border-[#004643]/10 bg-white/70 p-6 shadow-xl shadow-[#004643]/5 backdrop-blur">
    <h3 class="text-2xl font-black text-[#004643]">{{ editingProduct() ? 'تعديل المنتج' : 'إضافة منتج جديد' }}</h3>
    <form (ngSubmit)="editingProduct() ? saveProduct() : addNewProduct()" class="mt-5 grid grid-cols-1 gap-4 md:grid-cols-2">
      <div>
        <label class="block text-sm font-black text-[#004643]">اسم المنتج</label>
        <input type="text" [(ngModel)]="productFormModel.name" name="productName" required class="mt-2 block w-full rounded-2xl border border-[#004643]/10 bg-[#F0EDE5] px-4 py-3 font-bold text-[#004643] outline-none focus:ring-4 focus:ring-[#004643]/10">
      </div>
      <div>
        <label class="block text-sm font-black text-[#004643]">السعر (د.ع)</label>
        <input type="number" [(ngModel)]="productFormModel.price" name="productPrice" required class="mt-2 block w-full rounded-2xl border border-[#004643]/10 bg-[#F0EDE5] px-4 py-3 font-bold text-[#004643] outline-none focus:ring-4 focus:ring-[#004643]/10">
      </div>
      <div class="md:col-span-2">
        <label class="block text-sm font-black text-[#004643]">الوصف</label>
        <textarea [(ngModel)]="productFormModel.description" name="productDescription" rows="2" class="mt-2 block w-full rounded-2xl border border-[#004643]/10 bg-[#F0EDE5] px-4 py-3 font-bold text-[#004643] outline-none focus:ring-4 focus:ring-[#004643]/10"></textarea>
      </div>
      <div class="md:col-span-2">
        <label class="block text-sm font-black text-[#004643]">رابط الصورة</label>
        <input type="text" [(ngModel)]="productFormModel.imageUrl" name="productImageUrl" required class="mt-2 block w-full rounded-2xl border border-[#004643]/10 bg-[#F0EDE5] px-4 py-3 font-bold text-[#004643] outline-none focus:ring-4 focus:ring-[#004643]/10">
      </div>
      <div class="md:col-span-2 flex justify-end gap-2">
        @if(editingProduct()) {
          <button type="button" (click)="cancelEditing()" class="rounded-2xl bg-[#F0EDE5] px-5 py-3 text-sm font-black text-[#004643] hover:bg-white">إلغاء</button>
          <button type="submit" class="rounded-2xl bg-[#004643] px-5 py-3 text-sm font-black text-[#F0EDE5] hover:bg-[#003B38]">حفظ التعديلات</button>
        } @else {
          <button type="submit" class="rounded-2xl bg-[#004643] px-5 py-3 text-sm font-black text-[#F0EDE5] shadow-lg shadow-[#004643]/20 hover:bg-[#003B38]">إضافة المنتج</button>
        }
      </div>
    </form>
  </section>

  <section class="overflow-hidden rounded-[2rem] border border-[#004643]/10 bg-white/70 shadow-xl shadow-[#004643]/5 backdrop-blur">
    <table class="min-w-full divide-y divide-[#004643]/10">
      <thead class="bg-[#F0EDE5]">
        <tr>
          <th scope="col" class="px-6 py-4 text-right text-xs font-black uppercase tracking-wider text-[#004643]/55">المنتج</th>
          <th scope="col" class="px-6 py-4 text-right text-xs font-black uppercase tracking-wider text-[#004643]/55">السعر</th>
          <th scope="col" class="relative px-6 py-4"><span class="sr-only">إجراءات</span></th>
        </tr>
      </thead>
      <tbody class="divide-y divide-[#004643]/10">
        @for(product of products(); track product.id) {
          <tr class="transition hover:bg-[#F0EDE5]/60">
            <td class="whitespace-nowrap px-6 py-4">
              <div class="flex items-center">
                <img class="h-12 w-12 rounded-2xl object-cover shadow" [src]="product.imageUrl" alt="">
                <div class="mr-4">
                  <div class="text-sm font-black text-[#004643]">{{ product.name }}</div>
                  <div class="text-sm text-[#004643]/55">{{ product.description }}</div>
                </div>
              </div>
            </td>
            <td class="whitespace-nowrap px-6 py-4 text-sm font-black text-[#004643]">{{ product.price | number:'1.0-0' }} د.ع</td>
            <td class="whitespace-nowrap px-6 py-4 text-left text-sm font-black">
              <button (click)="startEditing(product)" class="text-[#004643] hover:underline">تعديل</button>
              <button (click)="deleteProduct(product.id)" class="mr-4 text-red-600 hover:underline">حذف</button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </section>
</div>
